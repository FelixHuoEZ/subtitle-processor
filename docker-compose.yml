services:
  subtitle-processor:
    build: # 直接运行、不构建的时候，注释掉
      context: .
    image: ${SUBTITLE_PROCESSOR_IMAGE:-subtitle-processor:latest}
    container_name: subtitle-processor
    restart: unless-stopped
    # deploy 部分仅在具备 NVIDIA GPU runtime 时启用
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    ports:
      - "6000:5000" # Web 界面 (临时映射到宿主6000)
      # - "5001:5900" # VNC 服务端口（如需启用图形界面可取消注释）
    volumes:
      # - /share/docker/subtitle-processor/uploads:/app/uploads
      # - /share/docker/subtitle-processor/videos:/app/videos
      # - /share/docker/subtitle-processor/outputs:/app/outputs
      # - /share/docker/subtitle-processor/config:/app/config
      # - /share/docker/subtitle-processor/models:/app/models
      # - /share/docker/subtitle-processor/firefox_profile:/root/.mozilla/firefox  # Firefox 配置目录
      - ./app:/app/app # 映射应用代码
      - ./uploads:/app/uploads
      - ./videos:/app/videos
      - ./outputs:/app/outputs
      - ./config:/app/config
      - ./firefox_profile:/root/.mozilla/firefox # Firefox cookie目录
    environment:
      - TZ=Asia/Shanghai
      - FLASK_APP=run_app.py
      - FLASK_ENV=production
      - FLASK_DEBUG=${FLASK_DEBUG:-false}
      - STORAGE_BACKEND=redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_KEY_PREFIX=subtitle_processor
      - RUNTIME_METRICS_ENABLED=${RUNTIME_METRICS_ENABLED:-true}
      - RUNTIME_METRICS_MAX_EVENTS=${RUNTIME_METRICS_MAX_EVENTS:-50000}
      - ACCESS_AUTH_ENABLED=${ACCESS_AUTH_ENABLED:-false}
      - ACCESS_TEAM_DOMAIN=${ACCESS_TEAM_DOMAIN:-}
      - ACCESS_WEB_APPLICATION_AUD=${ACCESS_WEB_APPLICATION_AUD:-}
      - ACCESS_API_APPLICATION_AUD=${ACCESS_API_APPLICATION_AUD:-}
      - ACCESS_ALLOWED_ORIGINS=${ACCESS_ALLOWED_ORIGINS:-}
      - ACCESS_JWT_LEEWAY_SECONDS=${ACCESS_JWT_LEEWAY_SECONDS:-60}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      # 热词策略可选开关
      - HOTWORD_MODE=curated # user_only/curated/experiment
      # - HOTWORD_MAX_COUNT=20           # 自动热词最大数量
      - ENABLE_AUTO_HOTWORDS=true # 启用自动热词生成
      - ENABLE_HOTWORD_POST_PROCESS=true
      # - HOTWORD_POST_SIMILARITY=0.82
      # - ENABLE_HOTWORD_SUBSTRING=false
      # 只对外部请求使用代理
      # - NO_PROXY=subtitle-processor,telegram-bot,transcribe-audio,redis,bgutil-provider,localhost,127.0.0.1
      # - ALL_PROXY=http://host.docker.internal:10808
      # - HTTP_PROXY=http://host.docker.internal:10808
      # - HTTPS_PROXY=http://host.docker.internal:10808
      # 从配置文件读取所有配置
      - CONFIG_PATH=/app/config/config.yml
      - BGUTIL_PROVIDER_URL=${BGUTIL_PROVIDER_URL:-http://bgutil-provider:4416}
      - YT_DLP_EXTRACTOR_ARGS=youtubepot-bgutilhttp:base_url=http://bgutil-provider:4416
      - YTDLP_PLAYER_CLIENTS=web_safari,web,tv
      - TRANSCRIBE_MAX_RETRIES=${TRANSCRIBE_MAX_RETRIES:-5}
      - TRANSCRIBE_TIMEOUT_MIN=${TRANSCRIBE_TIMEOUT_MIN:-300}
      - TRANSCRIBE_TIMEOUT_MAX=${TRANSCRIBE_TIMEOUT_MAX:-1800}
      - TRANSCRIBE_TIMEOUT_FACTOR=${TRANSCRIBE_TIMEOUT_FACTOR:-1.5}
      - TRANSCRIBE_CONCURRENCY=${TRANSCRIBE_CONCURRENCY:-}
      - AUDIO_PROBE_PROVIDERS=${AUDIO_PROBE_PROVIDERS:-configured_funasr}
      - AUDIO_PROBE_MIN_CONFIDENCE=${AUDIO_PROBE_MIN_CONFIDENCE:-0.58}
      - DOWNLOAD_CONCURRENCY=${DOWNLOAD_CONCURRENCY:-2}
      - DOWNLOAD_MAX_RETRIES=${DOWNLOAD_MAX_RETRIES:-3}
      - DOWNLOAD_RETRY_BASE_DELAY=${DOWNLOAD_RETRY_BASE_DELAY:-2}
      - DOWNLOAD_RETRY_BACKOFF=${DOWNLOAD_RETRY_BACKOFF:-2}
      - DOWNLOAD_RETRY_MAX_DELAY=${DOWNLOAD_RETRY_MAX_DELAY:-30}
      - DOWNLOAD_TOTAL_TIMEOUT_SECONDS=${DOWNLOAD_TOTAL_TIMEOUT_SECONDS:-180}
      - DOWNLOAD_SOCKET_TIMEOUT_SECONDS=${DOWNLOAD_SOCKET_TIMEOUT_SECONDS:-30}
      - DOWNLOAD_ASSET_CACHE_ENABLED=${DOWNLOAD_ASSET_CACHE_ENABLED:-false}
      - DOWNLOAD_ASSET_CACHE_DIR=${DOWNLOAD_ASSET_CACHE_DIR:-/app/uploads/cache/media}
      - DOWNLOAD_ASSET_CACHE_TTL_DAYS=${DOWNLOAD_ASSET_CACHE_TTL_DAYS:-30}
      - DOWNLOAD_ASSET_CACHE_STORE_SOURCE=${DOWNLOAD_ASSET_CACHE_STORE_SOURCE:-true}
      - AUTO_RETRY_INTERRUPTED_TASKS=${AUTO_RETRY_INTERRUPTED_TASKS:-false}
      - AUTO_RETRY_INTERRUPTED_MAX_ATTEMPTS=${AUTO_RETRY_INTERRUPTED_MAX_ATTEMPTS:-3}
      - AUTO_RETRY_INTERRUPTED_DELAY_SECONDS=${AUTO_RETRY_INTERRUPTED_DELAY_SECONDS:-5}
      - READWISE_URL_ONLY_WHEN_ZH_SUBS=${READWISE_URL_ONLY_WHEN_ZH_SUBS:-true}
      - READWISE_AUTO_FALLBACK_ON_PARSE_FAILED=${READWISE_AUTO_FALLBACK_ON_PARSE_FAILED:-true}
      - YOUTUBE_READER_INCREMENTAL_REFRESH_SECONDS=${YOUTUBE_READER_INCREMENTAL_REFRESH_SECONDS:-1800}
      - YOUTUBE_READER_FULL_REFRESH_SECONDS=${YOUTUBE_READER_FULL_REFRESH_SECONDS:-86400}
      - YOUTUBE_READER_INCREMENTAL_OVERLAP_SECONDS=${YOUTUBE_READER_INCREMENTAL_OVERLAP_SECONDS:-300}
      - AUTO_TRANSLATE_NON_TARGET_LANGUAGE=${AUTO_TRANSLATE_NON_TARGET_LANGUAGE:-false}
      - AUTO_TRANSLATE_TARGET_LANGUAGE=${AUTO_TRANSLATE_TARGET_LANGUAGE:-zh}
      - AUTO_TRANSLATE_MIN_SOURCE_CONFIDENCE=${AUTO_TRANSLATE_MIN_SOURCE_CONFIDENCE:-0.75}

    networks:
      - srt-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - bgutil-provider
      - redis
    #   - deeplx
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read(1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  transcribe-audio:
    build: # 直接运行、不构建的时候，注释掉
      context: ./transcribe-audio
      dockerfile: Dockerfile
    image: ${TRANSCRIBE_AUDIO_IMAGE:-transcribe-audio:latest}
    container_name: transcribe-audio
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    ports:
      - "10095:10095" # API 服务端口
    volumes:
      # - /share/docker/subtitle-processor/uploads:/app/uploads
      # - /share/docker/subtitle-processor/videos:/app/videos
      # - /share/docker/subtitle-processor/models:/app/models
      # - /share/docker/subtitle-processor/outputs:/app/outputs
      # - /share/docker/subtitle-processor/config:/app/config
      - ./uploads:/app/uploads
      - ./videos:/app/videos
      - ./outputs:/app/outputs
      - ./config:/app/config
      - ./models:/app/runtime-models
      - ./transcribe-audio/logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - MODEL_DIR=/app/runtime-models
      - MODELSCOPE_CACHE=/app/runtime-models
      - HF_HOME=/app/runtime-models
      - TORCH_HOME=/app/runtime-models
      - FUNASR_MODEL=paraformer-zh
      - FUNASR_VAD_MODEL=fsmn-vad
      - FUNASR_PUNC_MODEL=ct-punc
      # 从配置文件读取所有配置
      - CONFIG_PATH=/app/config/config.yml
      # FunASR 热词后处理（默认关闭）
      # - ENABLE_HOTWORD_POST_PROCESS=true
      # - HOTWORD_POST_SIMILARITY=0.85
      # - ENABLE_HOTWORD_SUBSTRING=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10095/health', timeout=5).read(1)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - srt-network

  bgutil-provider:
    build:
      context: ./docker-config/bgutil
      dockerfile: Dockerfile
    container_name: bgutil-provider
    restart: unless-stopped
    ports:
      - "4416:4416"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4416/ping', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - srt-network

  redis:
    image: redis:7-alpine
    container_name: subtitle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - srt-network

  # deeplx:
  #   image: ghcr.io/owo-network/deeplx:latest
  #   container_name: deeplx
  #   restart: unless-stopped
  #   ports:
  #     - "1188:1188"
  #   networks:
  #     - srt-network

  telegram-bot:
    profiles: [telegram]
    build: # 直接运行、不构建的时候，注释掉
      context: ./telegram-bot
      dockerfile: Dockerfile
    image: ${TELEGRAM_BOT_IMAGE:-telegram-bot:latest}
    container_name: telegram-bot
    restart: unless-stopped
    ports:
      - "8082:8082" # Webhook 监听端口（启用 Webhook 时需要）
    environment:
      - TZ=Asia/Shanghai
      - SUBTITLE_PROCESSOR_URL=http://subtitle-processor:5000
      - SUBTITLE_PROCESSOR_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      - TELEGRAM_WEBHOOK_ENABLED=true
      - TELEGRAM_WEBHOOK_PORT=8082
      - TELEGRAM_WEBHOOK_LISTEN=0.0.0.0
      - TELEGRAM_WEBHOOK_PATH=/telegram/webhook
      - TELEGRAM_HEARTBEAT_STARTUP_GRACE_SECONDS=${TELEGRAM_HEARTBEAT_STARTUP_GRACE_SECONDS:-300}
      - TELEGRAM_BOT_ENABLED=${TELEGRAM_BOT_ENABLED:-true}
      - SUBTITLE_CONNECT_TIMEOUT=${SUBTITLE_CONNECT_TIMEOUT:-120}
      - SUBTITLE_READ_TIMEOUT=${SUBTITLE_READ_TIMEOUT:-1800}
      # - NO_PROXY=subtitle-processor,localhost,127.0.0.1
      # - ALL_PROXY=http://host.docker.internal:20172
      # - HTTP_PROXY=http://host.docker.internal:20172
      # - HTTPS_PROXY=http://host.docker.internal:20172
      # 从配置文件读取所有配置
      - CONFIG_PATH=/app/config/config.yml
    volumes:
      - ./config:/app/config
      # - /share/docker/subtitle-processor/config:/app/config
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import requests; requests.get(''http://localhost:8081/health'', timeout=10)" || exit 1',
        ]
      interval: 60s # 每60秒检查一次
      timeout: 10s # 检查超时10秒
      retries: 3 # 失败3次后认为不健康
      start_period: 60s # 启动后60秒开始检查
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - srt-network
    depends_on:
      - subtitle-processor
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  srt-network:
    driver: bridge
